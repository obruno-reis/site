# Config do Cloudflare Worker que serve a última atividade do Strava.
# Deploy: dentro da pasta worker/ rode  npx wrangler deploy
name = "brunoreis-strava"
main = "strava.js"
compatibility_date = "2024-11-01"

# Origem liberada no CORS (o site que pode ler o Worker).
[vars]
ALLOW_ORIGIN = "https://brunoreis.cc"

# Os segredos NÃO ficam aqui. Defina com:
#   npx wrangler secret put STRAVA_CLIENT_ID
#   npx wrangler secret put STRAVA_CLIENT_SECRET
#   npx wrangler secret put STRAVA_REFRESH_TOKEN
