# Configuração do site (Bruno Reis) para o Netlify.
#
# O site é gerado por um script (build.js) a partir de content/ + templates/.
# O Netlify roda o build e publica a pasta "dist/".
[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache longo para assets versionados/estáveis (imagens, css com ?v=, js).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML sempre revalidado (para as atualizações aparecerem na hora).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cabeçalhos básicos de segurança.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
